# Turns "[guestbook] ..." issues into commits on the guestbook data file,
# so visitors without a token can still write to the app.
name: Guestbook entry from issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: guestbook-write
  cancel-in-progress: false

jobs:
  add-entry:
    if: startsWith(github.event.issue.title, '[guestbook]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          DATA_PATH: docs/data/entries.json
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const path = process.env.DATA_PATH;
            const branch = context.payload.repository.default_branch;

            // Parse the ```json block written by the web app (fallback: whole body as message).
            let name = "", message = "";
            const m = (issue.body || "").match(/```json\s*([\s\S]*?)```/);
            try {
              const data = JSON.parse(m ? m[1] : "{}");
              name = String(data.name || "");
              message = String(data.message || "");
            } catch {}
            if (!message) message = (issue.body || "").replace(/<!--[\s\S]*?-->/g, "").trim();
            name = name.trim().slice(0, 80) || issue.user.login;
            message = message.trim().slice(0, 2000);

            if (!message) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: "No message found, nothing was saved." });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed", state_reason: "not_planned" });
              return;
            }

            const entry = {
              id: require("crypto").randomUUID(),
              name, message,
              date: new Date().toISOString(),
              via: "issue",
              github_user: issue.user.login,
              issue: issue.number,
            };

            // Read-modify-write with retry on sha conflicts.
            let commit;
            for (let attempt = 0; attempt < 3 && !commit; attempt++) {
              let entries = [], sha;
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
                entries = JSON.parse(Buffer.from(data.content, "base64").toString("utf8") || "[]");
                sha = data.sha;
              } catch (e) { if (e.status !== 404) throw e; }
              entries.push(entry);
              try {
                const res = await github.rest.repos.createOrUpdateFileContents({
                  owner, repo, path, branch, sha,
                  message: `guestbook: add entry from ${name} (#${issue.number})`,
                  content: Buffer.from(JSON.stringify(entries, null, 2) + "\n").toString("base64"),
                });
                commit = res.data.commit;
              } catch (e) { if (![409, 422].includes(e.status) || attempt === 2) throw e; }
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: `Saved to the guestbook in commit ${commit.sha}. Thanks!`,
            });
            await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed", state_reason: "completed" });

apply plugin: 'com.android.application'

android {
    namespace 'com.reelriot.vegas'
    compileSdk 34

    defaultConfig {
        applicationId 'com.reelriot.vegas'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['res']
            assets.srcDirs = ['../assets']
            jniLibs.srcDirs = ['libs']
        }
    }

    // Skip the release lint pass: it downloads a large toolchain on every fresh machine.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // A development key kept with the project so every new build installs as
    // an update over the last one (and keeps your saved coins).
    signingConfigs {
        dev {
            storeFile file('reelriot-dev.keystore')
            storePassword 'reelriot'
            keyAlias 'reelriot'
            keyPassword 'reelriot'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.dev }
        release {
            minifyEnabled false
            signingConfig signingConfigs.dev
        }
    }
}

configurations { natives }

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
}

// Unpack libGDX's native libraries where Android packaging looks for them.
tasks.register('copyAndroidNatives') {
    doFirst {
        file('libs/armeabi-v7a').mkdirs()
        file('libs/arm64-v8a').mkdirs()
        configurations.natives.copy().files.each { jar ->
            def out = jar.name.endsWith('natives-arm64-v8a.jar') ? 'libs/arm64-v8a'
                    : jar.name.endsWith('natives-armeabi-v7a.jar') ? 'libs/armeabi-v7a' : null
            if (out) copy { from zipTree(jar); into file(out); include '*.so' }
        }
    }
}
tasks.matching { it.name.contains('merge') && it.name.contains('JniLibFolders') }.configureEach {
    dependsOn 'copyAndroidNatives'
}
